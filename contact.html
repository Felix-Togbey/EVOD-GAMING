<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EVOD Gaming | Contact</title>

    <link rel="stylesheet" href="css/style1.css">
    <script src="js/contact.js" defer></script>
    <script src="js/theme.js" defer></script>
</head>

<body>

    <header>
        <h1>EVOD GAMING</h1>
        <p>Connect. Compete. Conquer.</p>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="news.html">News</a>
            <a href="events.html">Events</a>
            <a href="join.html">Join Us</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>

        <button id="themeToggle" type="button" aria-label="Toggle theme">☼</button>
    </header>

    <main>

        <section class="intro">
            <h2>Contact Us</h2>
            <p>
                Have questions, suggestions, or feedback?
                We'd love to hear from you. Get in touch with us!
            </p>
        </section>

        <section>

            <form id="contactForm" novalidate>

                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>

                <br><br>

                <label for="contactEmail">Your Email:</label>
                <input type="email" id="contactEmail" name="email" required>

                <br><br>

                <label for="subject">Subject:</label>

                <select id="subject" name="subject" required>
                    <option value="">Choose a subject</option>
                    <option value="support">Technical Support</option>
                    <option value="question">General Question</option>
                    <option value="suggestion">Suggestion</option>
                    <option value="partnership">Partnership</option>
                </select>

                <br><br>

                <label for="message">Your Message:</label>

                <br>

                <textarea id="message" name="message" rows="6" cols="40" placeholder="Write your message here..."
                    required></textarea>

                <br><br>

                <button type="submit">Send Message</button>

            </form>

            <p id="contactMessage"></p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 EVOD Gaming. All rights reserved.</p>
    </footer>

</body>

</html>
